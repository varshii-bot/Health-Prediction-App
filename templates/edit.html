<!DOCTYPE html>
<html>

<head>

<title>Edit Patient</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Edit Patient</h2>

<form method="POST">

<div class="mb-3">

<label>Full Name</label>

<input type="text"
name="fullname"
value="{{ patient.fullname }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Date of Birth</label>

<input type="date"
name="dob"
value="{{ patient.dob }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
value="{{ patient.email }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Glucose</label>

<input type="number"
step="0.1"
min="0"
name="glucose"
value="{{ patient.glucose }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Haemoglobin</label>

<input type="number"
step="0.1"
min="0"
name="haemoglobin"
value="{{ patient.haemoglobin }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Cholesterol</label>

<input type="number"
step="0.1"
min="0"
name="cholesterol"
value="{{ patient.cholesterol }}"
class="form-control"
required>

</div>

<button class="btn btn-success">

Update

</button>

<a href="/" class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>

</html>
